[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rt-hid"
version = "0.1.0"
description = "Standalone local host intrusion detection agent for Linux and Windows"
requires-python = ">=3.10"
dependencies = ["flask>=3.0", "werkzeug>=3.0", "psutil>=5.9", "pywin32>=306; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rt_hid.host" = ["dashboard.html", "login.html", "change_password.html"]
