<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set admin password · Host Security</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0b111a; color: #edf3fa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 80% 10%, #183747 0, transparent 35%), #0b111a; }
    main { width: min(100%, 420px); background: #131d2a; border: 1px solid #2c4558; box-shadow: 0 20px 70px #02060bbb; border-radius: 18px; padding: 34px; }
    .eyebrow { color: #72cbd0; font-size: 12px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 11px 0 8px; font-size: 29px; letter-spacing: -.04em; }
    p { color: #a1b2c4; line-height: 1.5; margin: 0 0 26px; font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: 700; margin: 16px 0 8px; }
    input { width: 100%; border-radius: 9px; border: 1px solid #40576b; background: #0c1520; color: #edf3fa; padding: 13px 14px; font: inherit; }
    input:focus { outline: 2px solid #66c2cc; }
    button { width: 100%; margin-top: 22px; border: 0; border-radius: 9px; background: #70c7ce; color: #07151d; font: inherit; font-weight: 800; padding: 13px; cursor: pointer; }
    .error { border: 1px solid #744048; background: #321f27; border-radius: 8px; color: #ffc1bc; padding: 10px 12px; font-size: 13px; margin-bottom: 18px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">RT-HID · Local host security</div>
    <h1>Set a new password</h1>
    <p>Replace the default admin password before opening the dashboard. Use at least 12 characters.</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/change-password">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required autofocus>
      <label for="confirmation">Confirm new password</label>
      <input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="12" required>
      <button type="submit">Save password and open dashboard</button>
    </form>
  </main>
</body>
</html>
