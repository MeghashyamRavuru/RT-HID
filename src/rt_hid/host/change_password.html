<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set admin password · RT-HID</title>
  <style>
    :root { color-scheme:dark; font-family:Inter,ui-sans-serif,system-ui,Segoe UI,sans-serif; --bg:#0b121c; --surface:#121f2c; --line:#294051; --text:#e5eef3; --muted:#9aafbc; --teal:#61c6c6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); padding:22px; }
    main { width:min(100%,440px); border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:30px; box-shadow:0 18px 45px #0005; }
    .brand { display:flex; align-items:center; gap:11px; padding-bottom:23px; border-bottom:1px solid var(--line); }
    .mark { width:36px; height:36px; border:1px solid var(--teal); border-radius:9px; color:var(--teal); display:grid; place-items:center; font-weight:800; }
    .brand strong { display:block; font-size:15px; letter-spacing:.08em; }
    .brand small { color:var(--muted); font-size:10px; letter-spacing:.1em; text-transform:uppercase; }
    h1 { font-size:25px; margin:24px 0 8px; letter-spacing:-.03em; }
    p { color:var(--muted); font-size:13px; line-height:1.5; margin:0 0 22px; }
    label { display:block; font-size:12px; font-weight:700; margin:16px 0 7px; }
    input { width:100%; min-width:0; border:1px solid #385064; border-radius:7px; padding:11px 12px; background:#0e1a26; color:var(--text); font:inherit; }
    button { cursor:pointer; font:inherit; }
    :focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
    .password-row { display:flex; gap:7px; }
    .toggle { border:1px solid #385064; border-radius:7px; background:#1a3441; color:var(--text); padding:0 12px; font-size:12px; }
    .submit { width:100%; border:1px solid #31979b; border-radius:8px; padding:11px; margin-top:23px; background:#287d81; color:#fff; font-weight:750; }
    .submit:disabled { opacity:.65; cursor:wait; }
    .error { border:1px solid #8a484b; color:#ffc1bd; background:#35252b; border-radius:7px; padding:10px 12px; font-size:12px; margin-bottom:15px; }
    .foot { border-top:1px solid var(--line); margin-top:27px; padding-top:17px; color:var(--muted); font-size:11px; line-height:1.5; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">R</span><div><strong>RT-HID</strong><small>Host security console</small></div></div>
    <h1>Set a new password</h1>
    <p>Replace the default password before opening the dashboard. Use at least 12 characters.</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form id="auth-form" method="post" action="/change-password">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="password">New password</label>
      <div class="password-row"><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required autofocus><button class="toggle" id="toggle-password" type="button" aria-label="Show new password" aria-pressed="false">Show</button></div>
      <label for="confirmation">Confirm new password</label>
      <input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="12" required>
      <button class="submit" id="submit" type="submit">Save password and open dashboard</button>
    </form>
    <div class="foot">Your password is stored as a hash in the local database.</div>
  </main>
  <script>
    const toggle = document.querySelector('#toggle-password');
    const password = document.querySelector('#password');
    toggle.addEventListener('click', () => { const show = password.type === 'password'; password.type = show ? 'text' : 'password'; toggle.textContent = show ? 'Hide' : 'Show'; toggle.setAttribute('aria-pressed', String(show)); toggle.setAttribute('aria-label', show ? 'Hide new password' : 'Show new password'); });
    document.querySelector('#auth-form').addEventListener('submit', event => { if (password.value !== document.querySelector('#confirmation').value) { event.preventDefault(); document.querySelector('#confirmation').setCustomValidity('Passwords do not match'); document.querySelector('#confirmation').reportValidity(); return; } const button = document.querySelector('#submit'); button.disabled = true; button.textContent = 'Saving…'; });
    document.querySelector('#confirmation').addEventListener('input', event => event.target.setCustomValidity(''));
  </script>
</body>
</html>
